{{- if .Values.argoPatches.enabled }}
# Mount PDE UI bundle into argocd-server via init container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-server
  namespace: {{ include "pde-argo-extension.argocdNamespace" . }}
spec:
  template:
    spec:
      volumes:
        - name: pde-argo-extension-ui
          emptyDir: {}
      initContainers:
        - name: pde-argo-extension-ui
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "pde-argo-extension.uiConfigMapName" . }}
          volumeMounts:
            - name: pde-argo-extension-ui
              mountPath: /tmp/extensions
      containers:
        - name: argocd-server
          volumeMounts:
            - name: pde-argo-extension-ui
              mountPath: /tmp/extensions
{{- end }}
