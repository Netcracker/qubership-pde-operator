{{- $fullname := include "pde-argo-extension.backendName" . -}}
{{- $token := .Values.backend.operatorApiToken | toString -}}
{{- if not $token -}}
  {{- $opSecret := lookup "v1" "Secret" .Values.backend.operatorSecret.namespace .Values.backend.operatorSecret.name -}}
  {{- if and $opSecret (hasKey $opSecret.data .Values.backend.operatorSecret.key) -}}
    {{- $token = index $opSecret.data .Values.backend.operatorSecret.key | b64dec -}}
  {{- end -}}
{{- end -}}
{{- if not $token -}}
  {{- fail "backend.operatorApiToken is empty and operator secret was not found; set backend.operatorApiToken or ensure backend.operatorSecret points to pde-operator secret" -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  namespace: {{ include "pde-argo-extension.argocdNamespace" . }}
  labels:
    {{- include "pde-argo-extension.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-admin-token: {{ $token | quote }}
