[project]
name = "qubership-pde-operator"
version = "0.0.1"
description = "Kubernetes control plane for PDE pipeline runs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "boto3>=1.43.46",
    "fastapi>=0.139.0",
    "kubernetes>=36.0.2",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.32",
    "croniter>=6.0.0",
    "sqlalchemy[asyncio]>=2.0.51",
    "uvicorn[standard]>=0.51.0",
    "pyjwt>=2.13.0",
    "mcp>=1.27,<2",
    "prometheus-client>=0.26.0",
    "PyYAML>=6.0.3",
    "GitPython>=3.1.59",
    "cryptography>=50.0.0",
]

[project.scripts]
pde-operator = "pde_operator.__main__:main"
pde-operator-init-db = "pde_operator.scripts.init_db:main"

[dependency-groups]
dev = [
    "httpx2>=2.9.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.15.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pde_operator"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
