apiVersion: v1
kind: Service
metadata:
  name: {{ include "pde-operator.serviceName" . }}
  labels:
    {{- include "pde-operator.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "pde-operator.selectorLabels" . | nindent 4 }}
