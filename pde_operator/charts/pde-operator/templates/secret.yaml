{{- $fullname := include "pde-operator.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $fullname -}}
{{- $admin := .Values.auth.apiAdminToken | toString -}}
{{- $signing := .Values.auth.jobTokenSigningKey | toString -}}
{{- $inputKey := .Values.auth.inputEncryptionKey | toString -}}
{{- if and $existing $existing.data -}}
  {{- if and (not $admin) (hasKey $existing.data "api-admin-token") -}}
    {{- $admin = index $existing.data "api-admin-token" | b64dec -}}
  {{- end -}}
  {{- if and (not $signing) (hasKey $existing.data "job-token-signing-key") -}}
    {{- $signing = index $existing.data "job-token-signing-key" | b64dec -}}
  {{- end -}}
  {{- if and (not $inputKey) (hasKey $existing.data "input-encryption-key") -}}
    {{- $inputKey = index $existing.data "input-encryption-key" | b64dec -}}
  {{- end -}}
{{- end -}}
{{- if not $admin -}}
  {{- $admin = randAlphaNum 48 -}}
{{- end -}}
{{- if not $signing -}}
  {{- $signing = randAlphaNum 64 -}}
{{- end -}}
{{- if not $inputKey -}}
  {{- $inputKey = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "pde-operator.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-admin-token: {{ $admin | quote }}
  job-token-signing-key: {{ $signing | quote }}
  input-encryption-key: {{ $inputKey | quote }}
  database-url: {{ include "pde-operator.databaseUrl" . | quote }}
  minio-access-key: {{ include "pde-operator.minioAccessKey" . | quote }}
  minio-secret-key: {{ include "pde-operator.minioSecretKey" . | quote }}
  {{- if .Values.postgres.enabled }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  minio-root-user: {{ .Values.minio.auth.rootUser | quote }}
  minio-root-password: {{ .Values.minio.auth.rootPassword | quote }}
  {{- end }}
