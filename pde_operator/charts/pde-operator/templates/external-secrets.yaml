{{- if .Values.externalSecrets.create }}
{{- $name := include "pde-operator.externalSecretsName" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pde-operator.labels" . | nindent 4 }}
    app.kubernetes.io/component: external-secrets
type: Opaque
{{- if and $existing $existing.data }}
data:
  {{- range $key, $value := $existing.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- else }}
data: {}
{{- end }}
{{- end }}
