# PDE Operator trigger workflow - place at the target repository root.
#
# Runs:
#   - automatically on push to a branch matching PDE_TRIGGER_BRANCHES (uses the input defaults below)
#   - manually (CI/CD -> Pipelines -> Run pipeline) - inputs can be overridden
#   - RUN_MODE=input: trigger (default) starts the run and exits; follow waits for completion, fetches log and artifacts
#   - LIVE_LOGS=input (follow only): true additionally streams flat log lines while polling; false (default) = dots.
#     Either way the full log (with sections) is printed once at the end
#
# Add following variables to "CI/CD -> Variables" settings of repository:
# PDE_OPERATOR_URL
# PDE_OPERATOR_TOKEN
# GITLAB_TOKEN (for PDE AUTH_RULES, artifact download, operator env_vars)
# PDE_TRIGGER_BRANCHES (optional override; regex must stay slash-enclosed, e.g. '/^(main|release/.+)$/')
#
# Retry, RETRY_ID = GitLab job ID:
#   1) UI Retry - previous same-name job in this pipeline
#   2) New pipeline with RETRY_ID (+ optional RETRY_VARS)
#
# Native GitLab Cancel/Retry buttons work as expected.

spec:
  inputs:
    PIPELINE_DATA:
      type: string
      default: "https://gitlab.com/quber-test/quber-pipeline/-/raw/main/pipeline_configs/samples/deploy.yaml"
    PIPELINE_VARS:
      type: string
      default: "ENV_NAME=GITLAB_WORKFLOW;"
    RUN_MODE:
      description: "trigger = start the run and exit; follow = wait for completion, fetch log and artifacts"
      type: string
      options: ['trigger', 'follow']
      default: 'trigger'
    LIVE_LOGS:
      description: "live_logs: true = additionally stream flat log lines while polling; false = progress indication only. Either way the full log (with sections) is printed once at the end"
      type: boolean
      default: false
    LOG_LEVEL:
      type: string
      options: ['INFO', 'DEBUG', 'WARNING', 'ERROR']
      default: "INFO"
    IS_DRY_RUN:
      type: boolean
      default: true
    RETRY_ID:
      description: "Optional GitLab job ID to retry from. Leave empty for a fresh run (or use GitLab UI Retry)."
      type: string
      default: ""
    RETRY_VARS:
      description: "Optional retry vars (used when retrying; ignored on a fresh run)."
      type: string
      default: ""

---
variables:
  PDE_TRIGGER_BRANCHES: '/^(main|master)$/'

  PDE_RUN_ID_ARTIFACT: "pde_run_id.txt"
  PDE_RUN_MODE_FILE: ".pde_run_mode"
  PDE_LIVE_LOG_FILE: ".pde_live_log"
  PDE_X_DEBUG_ARTIFACT: "x_debug.zip"
  PDE_REPORT_ARTIFACT: "pipeline_report.json"

  # PDE env vars
  PIPELINES_DECLARATIVE_EXECUTOR_EXECUTION_URL: "${CI_JOB_URL}"
  PIPELINES_DECLARATIVE_EXECUTOR_EXECUTION_USER: "${GITLAB_USER_NAME}"
  PIPELINES_DECLARATIVE_EXECUTOR_EXECUTION_EMAIL: "${GITLAB_USER_EMAIL}"
  PIPELINES_DECLARATIVE_EXECUTOR_ENCRYPT_OUTPUT_SECURE_PARAMS: "False"
  PIPELINES_DECLARATIVE_EXECUTOR_AUTH_RULES: '[{"host":"gitlab.com","type":"token","headers":{"PRIVATE-TOKEN":"{token}"},"token_env_var":"GITLAB_TOKEN","is_gitlab_url":true}]'

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH =~ $PDE_TRIGGER_BRANCHES'
    - if: '$CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
    - when: never

.install_tools: &install_tools
  - apk add --no-cache --quiet curl jq >/dev/null 2>&1

.pde_helper_functions: &pde_helper_functions |
  pde_run() { printf '%b%s\033[0m' $'\033[1;33m' "$1"; }
  pde_red() { printf '%b%s\033[0m' $'\033[1;31m' "$1"; }
  pde_sep() { printf '%b\n' $'\033[1;36m═══════════════════════════════════════════════════════════════════════════\033[0m' >&2; }
  pde_log() { printf '%b  %s\n' $'\033[1;35m▌ '"${PDE_LOG_LABEL:-PDE}"$'\033[0m' "$*" >&2; }
  pde_script_begin() { pde_sep; }

  _operator_retry() {
    local a=1
    until "$@"; do
      [ "$a" -ge 5 ] && return 1
      pde_log "Request failed (${a}/5); retrying in 5s..."
      sleep 5
      a=$((a + 1))
    done
  }

  require_operator_config() {
    if [ -z "${PDE_OPERATOR_URL:-}" ] || [ -z "${PDE_OPERATOR_TOKEN:-}" ]; then
      pde_log "$(pde_red "Set CI/CD variables PDE_OPERATOR_URL and PDE_OPERATOR_TOKEN")"
      exit 1
    fi
  }

  operator_curl() {
    curl --header "Authorization: Bearer ${PDE_OPERATOR_TOKEN}" "$@"
  }

  operator_get() {
    _operator_retry operator_curl --fail-with-body --silent --show-error "$1" || exit 1
  }

  gitlab_api() {
    local method="$1" url="$2" out="${3:-}" tmp ok=1
    tmp="$(mktemp)"
    if [ -n "${GITLAB_TOKEN:-}" ] && curl --fail-with-body --silent --request "${method}" --header "PRIVATE-TOKEN: ${GITLAB_TOKEN}" --output "${tmp}" "${url}" 2>/dev/null; then
      ok=0
    fi
    if [ "${ok}" -ne 0 ]; then
      rm -f "${tmp}"
      pde_log "GitLab API request failed: ${method} ${url}"
      return 1
    fi
    if [ -n "${out}" ]; then
      mv "${tmp}" "${out}"
    else
      cat "${tmp}"
      rm -f "${tmp}"
    fi
    return 0
  }

  resolve_previous_job_id() {
    local jobs_json
    jobs_json="$(gitlab_api GET "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/pipelines/${CI_PIPELINE_ID}/jobs?include_retried=true&per_page=100")" || return 0
    if command -v jq >/dev/null 2>&1; then
      printf '%s' "${jobs_json}" | jq -r --arg name "${CI_JOB_NAME}" --argjson id "${CI_JOB_ID}" \
        '[.[] | select(.name == $name and .id < $id)] | max_by(.id) | .id // empty'
    else
      printf '%s' "${jobs_json}" | python -c 'import json,os,sys; jobs=json.load(sys.stdin); name,cid=os.environ["CI_JOB_NAME"],int(os.environ["CI_JOB_ID"]); cands=[j for j in jobs if j.get("name")==name and int(j.get("id") or 0)<cid]; print(max(cands, key=lambda j: j["id"])["id"] if cands else "", end="")'
    fi
  }

  resolve_retry_job_id() {
    local retry_id="$1" prev
    if [ -n "${retry_id}" ]; then
      pde_log "Explicit RETRY_ID · GitLab job ${retry_id}"
      printf '%s' "${retry_id}"
      return 0
    fi
    prev="$(resolve_previous_job_id || true)"
    if [ -n "${prev}" ]; then
      pde_log "GitLab retry detected (previous job ${prev})"
      printf '%s' "${prev}"
    fi
  }

  download_job_artifact() {
    local job_id="$1" artifact_path="$2" out="$3"
    gitlab_api GET "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/jobs/${job_id}/artifacts/${artifact_path}" "${out}"
  }

  fetch_operator_run_id_from_job() {
    local job_id="$1" tmp=".parent_run_id" run_id
    if ! download_job_artifact "${job_id}" "${PDE_RUN_ID_ARTIFACT}" "${tmp}"; then
      pde_log "$(pde_red "Job ${job_id} has no ${PDE_RUN_ID_ARTIFACT}; impossible to retry!")"
      return 1
    fi
    run_id="$(tr -d '[:space:]' < "${tmp}")"
    rm -f "${tmp}"
    if [ -z "${run_id}" ]; then
      pde_log "$(pde_red "${PDE_RUN_ID_ARTIFACT} is empty; impossible to retry!")"
      return 1
    fi
    printf '%s' "${run_id}"
  }

  collect_run_env_vars() {
    jq -n --arg token "${GITLAB_TOKEN:-}" '(env | with_entries(select(.key | startswith("PIPELINES_DECLARATIVE_EXECUTOR_"))))
       + {GITLAB_CI: "True"}
       + (if ($token | length) > 0 then {GITLAB_TOKEN: $token} else {} end)'
  }

stages:
  - execute_pipeline

run_operator:
  stage: execute_pipeline
  image: alpine:3.24
  interruptible: true
  variables:
    PDE_LOG_LABEL: "PDE Operator"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web" || $CI_PIPELINE_SOURCE == "api" || $CI_PIPELINE_SOURCE == "trigger"'
  script:
    - *install_tools
    - *pde_helper_functions
    - |
      set -euo pipefail
      pde_script_begin
      require_operator_config

      RETRY_ID="$[[ inputs.RETRY_ID ]]"
      RETRY_VARS="$[[ inputs.RETRY_VARS ]]"

      RETRY_JOB_ID="$(resolve_retry_job_id "${RETRY_ID}")"
      PARENT_RUN_ID=""
      if [ -n "${RETRY_JOB_ID}" ]; then
        PARENT_RUN_ID="$(fetch_operator_run_id_from_job "${RETRY_JOB_ID}")" || exit 1
        pde_log "Retrying operator run $(pde_run "${PARENT_RUN_ID}")"
      fi

      if [ -n "${PARENT_RUN_ID}" ]; then
        RUN_URL="${PDE_OPERATOR_URL}/api/v1/runs/${PARENT_RUN_ID}/retry"
        REQUEST_BODY="$(jq -n --arg retry_vars "${RETRY_VARS}" --argjson env_vars "$(collect_run_env_vars)" \
          '{env_vars: $env_vars, retry_vars: (if ($retry_vars | length) > 0 then $retry_vars else null end)}')"
      else
        pde_log "Creating operator run..."
        RUN_URL="${PDE_OPERATOR_URL}/api/v1/runs"
        REQUEST_BODY="$(jq -n \
          --arg pipeline_data "$[[ inputs.PIPELINE_DATA ]]" \
          --arg pipeline_vars "$[[ inputs.PIPELINE_VARS ]]" \
          --arg log_level "$[[ inputs.LOG_LEVEL ]]" \
          --argjson is_dry_run "$[[ inputs.IS_DRY_RUN ]]" \
          --argjson env_vars "$(collect_run_env_vars)" \
          '{pipeline_data: $pipeline_data, pipeline_vars: $pipeline_vars, is_dry_run: $is_dry_run, log_level: $log_level, env_vars: $env_vars}')"
      fi

      response_tmp="$(mktemp)"
      HTTP_CODE="$(operator_curl --silent --show-error --request POST --header "Content-Type: application/json" --data "${REQUEST_BODY}" --output "${response_tmp}" --write-out "%{http_code}" "${RUN_URL}")" || {
        pde_log "$(pde_red "Operator request failed (curl exit $?)")"
        rm -f "${response_tmp}"
        exit 1
      }
      if [ "${HTTP_CODE}" != 201 ]; then
        ERROR_MSG="$(jq -r '.detail // empty' "${response_tmp}" 2>/dev/null || true)"
        rm -f "${response_tmp}"
        if [ -n "${ERROR_MSG}" ]; then
          pde_log "$(pde_red "Operator request failed (HTTP ${HTTP_CODE}): ${ERROR_MSG}")"
        else
          pde_log "$(pde_red "Operator request failed (HTTP ${HTTP_CODE})")"
        fi
        exit 1
      fi
      RESPONSE="$(cat "${response_tmp}")"
      rm -f "${response_tmp}"

      RUN_ID="$(echo "${RESPONSE}" | jq -r '.id')"
      RUN_MODE="$[[ inputs.RUN_MODE ]]"
      LIVE_LOGS="$[[ inputs.LIVE_LOGS ]]"
      echo "${RUN_MODE}" > "${PDE_RUN_MODE_FILE}"
      echo "${RUN_ID}" > "${PDE_RUN_ID_ARTIFACT}"
      pde_log "Operator run $(pde_run "${RUN_ID}")"
      EXECUTION_URL="$(echo "${RESPONSE}" | jq -r '.execution_url // empty')"
      if [ -n "${EXECUTION_URL}" ]; then
        pde_log "Execution URL: ${EXECUTION_URL}"
      fi

      if [ "${RUN_MODE}" != "follow" ]; then
        pde_log "Run triggered; not waiting for completion (RUN_MODE=${RUN_MODE})"
        exit 0
      fi

      live_log_fetch() {
        # 0 = ok (delta printed if any); 1 = fetch failed; 2 = content replaced by the final (stdout) version
        if ! operator_curl --fail-with-body --silent --show-error --output "${PDE_LIVE_LOG_FILE}.new" \
            "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}/artifacts/log"; then
          rm -f "${PDE_LIVE_LOG_FILE}.new"
          return 1
        fi
        NEW_SIZE="$(wc -c < "${PDE_LIVE_LOG_FILE}.new")"
        if [ -f "${PDE_LIVE_LOG_FILE}" ]; then
          head -c "${LIVE_OFFSET}" "${PDE_LIVE_LOG_FILE}.new" > .pde_live_cmp.a
          head -c "${LIVE_OFFSET}" "${PDE_LIVE_LOG_FILE}" > .pde_live_cmp.b
          if ! cmp -s .pde_live_cmp.a .pde_live_cmp.b; then
            rm -f .pde_live_cmp.a .pde_live_cmp.b "${PDE_LIVE_LOG_FILE}.new"
            return 2
          fi
          rm -f .pde_live_cmp.a .pde_live_cmp.b
        fi
        if [ "${NEW_SIZE}" -gt "${LIVE_OFFSET}" ]; then
          tail -c +$((LIVE_OFFSET + 1)) "${PDE_LIVE_LOG_FILE}.new"
          LIVE_OFFSET="${NEW_SIZE}"
        fi
        mv "${PDE_LIVE_LOG_FILE}.new" "${PDE_LIVE_LOG_FILE}"
        return 0
      }

      LIVE_ACTIVE=0
      LIVE_TS=""
      LIVE_OFFSET=0
      DOTS_LINE=0
      if [ "${LIVE_LOGS}" = "true" ]; then
        LIVE_ACTIVE=1
        pde_log "Live logs enabled - streaming log lines while polling"
      fi

      pde_log "Polling for run execution to finish..."
      POLL_START="$(date +%s)"
      POLLS=0
      while true; do
        RUN_JSON="$(operator_get "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}")"
        STATUS="$(echo "${RUN_JSON}" | jq -r '.status')"
        case "${STATUS}" in
          SUCCESS|FAILED|CANCELLED) break ;;
        esac

        if [ "${LIVE_ACTIVE}" -eq 1 ]; then
          LOG_TS="$(echo "${RUN_JSON}" | jq -r '.log_updated_at // empty')"
          if [ -n "${LOG_TS}" ] && [ "${LOG_TS}" != "${LIVE_TS}" ]; then
            LIVE_RC=0
            live_log_fetch || LIVE_RC=$?
            case "${LIVE_RC}" in
              0) LIVE_TS="${LOG_TS}" ;;
              1) : ;; # fetch failed; the next poll retries
              2)
                printf '\n' >&2
                pde_log "$(pde_red "Log is already at its final version; stopping the live stream")"
                DOTS_LINE=0
                LIVE_ACTIVE=0
                ;;
            esac
          fi
        fi

        sleep 5
        POLLS=$((POLLS + 1))
        if [ "${LIVE_ACTIVE}" -eq 0 ]; then
          if [ $((POLLS % 12)) -eq 0 ]; then
            NOW="$(date +%s)"
            ELAPSED=$((NOW - POLL_START))
            printf ' %s · %dm%02ds\n' "${STATUS}" $((ELAPSED / 60)) $((ELAPSED % 60)) >&2
            DOTS_LINE=0
          else
            printf '.' >&2
            DOTS_LINE=1
          fi
        fi
      done

      if [ "${LIVE_ACTIVE}" -eq 1 ] && [ -f "${PDE_LIVE_LOG_FILE}" ] && [ -n "$(tail -c 1 "${PDE_LIVE_LOG_FILE}")" ]; then
        printf '\n' >&2
      fi
      if [ "${DOTS_LINE}" -eq 1 ]; then
        printf '\n' >&2
      fi

      echo "${STATUS}" > .pde_run_finished
      pde_log "Pipeline finished with status ${STATUS} · operator run $(pde_run "${RUN_ID}")"
      if [ "${STATUS}" != "SUCCESS" ]; then
        exit 1
      fi
  after_script:
    - *install_tools
    - *pde_helper_functions
    - |
      set +e
      pde_script_begin

      if [ ! -f "${PDE_RUN_ID_ARTIFACT}" ]; then
        pde_log "No operator run id; skipping log and artifacts"
        exit 0
      fi

      RUN_ID="$(tr -d '[:space:]' < "${PDE_RUN_ID_ARTIFACT}")"
      RUN_MODE="$(cat "${PDE_RUN_MODE_FILE}" 2>/dev/null || echo follow)"

      if [ "${RUN_MODE}" != "follow" ]; then
        pde_log "RUN_MODE=${RUN_MODE}; run $(pde_run "${RUN_ID}") triggered - skipping cancel/log/artifacts"
        exit 0
      fi

      if [ "${CI_JOB_STATUS:-}" = "canceled" ] && [ ! -f .pde_run_finished ]; then
        pde_log "GitLab job canceled · requesting operator cancel for run $(pde_run "${RUN_ID}")"
        _operator_retry operator_curl --fail-with-body --silent --show-error --output /dev/null --request POST "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}/cancel" || true
        pde_log "Waiting for operator run to reach a terminal status..."
        for _ in $(seq 1 12); do
          RUN_JSON="$(operator_get "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}")"
          STATUS="$(echo "${RUN_JSON}" | jq -r '.status')"
          case "${STATUS}" in
            SUCCESS|FAILED|CANCELLED) break ;;
          esac
          sleep 5
        done
        pde_log "Operator run $(pde_run "${RUN_ID}") status: ${STATUS:-unknown}"
      fi

      _operator_retry operator_curl --fail-with-body --silent --show-error --output console.log "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}/artifacts/log" || true
      if [ -s console.log ]; then
        pde_log "console.log · operator run $(pde_run "${RUN_ID}")"
        cat console.log
      fi
      _operator_retry operator_curl --fail-with-body --silent --show-error --output "${PDE_X_DEBUG_ARTIFACT}" "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}/artifacts/x_debug" || true
      _operator_retry operator_curl --fail-with-body --silent --show-error --output "${PDE_REPORT_ARTIFACT}" "${PDE_OPERATOR_URL}/api/v1/runs/${RUN_ID}/artifacts/report" || true
  artifacts:
    name: "execution_results"
    paths:
      - ${PDE_RUN_ID_ARTIFACT}
      - ${PDE_X_DEBUG_ARTIFACT}
      - ${PDE_REPORT_ARTIFACT}
    when: always
    expire_in: 1 week
